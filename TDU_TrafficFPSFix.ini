; TDU_TrafficFPSFix - fixes traffic / AI cars weaving and changing lanes erratically above 60 fps
; Place next to TDU_TrafficFPSFix.asi in the game's "scripts" folder.
[TrafficFPSFix]
; 1 = on, 0 = off (game behaves exactly as unpatched)
Enabled=1

; Rate (Hz) at which AI logic is evaluated. 60 reproduces the behaviour the game was tuned
; for. Frame rates at or below this value are not affected at all.
AIRate=60

; Fix 2: run each traffic car's AI tick (route follower, traffic state machine with its
; lane-change / overtake / junction logic, pilot target update) at AIRate instead of every frame.
FixLaneLogic=1

; Which cars Fix 2 applies to, as a bitmask of the car's driver type (car+0x1E14):
;   1 = type 0 = traffic driver (default)
;   other bits = types 1..3 (race AI / other drivers). The log lists how many cars of each
;   type were seen, e.g. DriverTypes=3 also covers type 1.
DriverTypes=1

; 1 = write TDU_TrafficFPSFix.log next to this file (hook status + counters every 10 s)
Log=0
